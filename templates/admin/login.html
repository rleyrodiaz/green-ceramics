<!doctype html>
<html lang="es">

<head>
    {% if is_production %}
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    {% else %}
    <link rel="icon" href="data:,">
    {% endif %}

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Green.</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.ico" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
    <div class="cuenta-layout">
        <div class="cuenta-auth">
            <a href="/" class="logo" style="margin-bottom:2rem;display:block">
                Green<span>.</span>
            </a>
            <p class="section-eyebrow">Panel de administración</p>
            <h2 class="auth-title">Ingresá</h2>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="admin@ceramics.com" />
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <div style="position:relative">
                    <input type="password" id="password" placeholder="········" style="width:100%;box-sizing:border-box;padding-right:2.5rem" />
                    <button type="button" onclick="togglePass('password',this)"
                            style="position:absolute;right:0.6rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:0;line-height:0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="error-msg" id="error"></div>
            <button class="btn-primary" style="width:100%" onclick="login()">
                Ingresar
            </button>
        </div>
    </div>

    <script>
        // Si ya hay token admin válido, redirigir
        // const token = localStorage.getItem("admin_token");
        // if (token) window.location = "/admin/dashboard";

        const token = localStorage.getItem("admin_token");
        if (token) {
            fetch("/api/admin/stats", {
                headers: { "Authorization": `Bearer ${token}` }
            }).then(res => {
                if (res.ok) window.location = "/admin/dashboard";
                else {
                    localStorage.removeItem("admin_token");
                    localStorage.removeItem("admin_user");
                }
            }).catch(() => {
                localStorage.removeItem("admin_token");
                localStorage.removeItem("admin_user");
            });
        }

        const _eyeOpen = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        const _eyeClosed = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

        function togglePass(id, btn) {
            const inp = document.getElementById(id);
            const show = inp.type === "password";
            inp.type = show ? "text" : "password";
            btn.innerHTML = show ? _eyeClosed : _eyeOpen;
        }

        async function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const errEl = document.getElementById("error");

            if (!email || !password) {
                errEl.textContent = "Completá email y contraseña.";
                errEl.style.display = "block";
                return;
            }

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password }),
                });

                if (!res.ok) {
                    errEl.textContent = "Credenciales incorrectas.";
                    errEl.style.display = "block";
                    return;
                }

                const data = await res.json();

                if (data.rol !== "admin" && data.rol !== "owner") {
                    errEl.textContent = "No tenés permisos de administrador.";
                    errEl.style.display = "block";
                    return;
                }

                localStorage.setItem("admin_token", data.token);
                localStorage.setItem("admin_user", JSON.stringify(data));
                window.location = "/admin/dashboard";

            } catch (e) {
                errEl.textContent = "Error de conexión.";
                errEl.style.display = "block";
            }
        }

        document.addEventListener("keydown", e => {
            if (e.key === "Enter") login();
        });
    </script>
</body>

</html>
