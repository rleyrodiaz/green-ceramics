<!doctype html>
<html lang="es">

<head>
    {% if is_production %}
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    {% else %}
    <link rel="icon" href="data:,">
    {% endif %}

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Órdenes — Admin Green.</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.ico" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/admin.css" />
</head>

<body class="admin-body">

    <aside class="admin-sidebar">
        <a href="/" class="admin-logo">
            Green<span style="color:var(--clay)">.</span>
        </a>

        <div class="admin-nav">
            <a href="/admin/dashboard" class="admin-nav-link">Dashboard</a>
            <a href="/admin/productos" class="admin-nav-link">Productos</a>
            <a href="/admin/ordenes" class="admin-nav-link active">Órdenes</a>
            <a href="/admin/usuarios" class="admin-nav-link">Usuarios</a>
            <a href="/admin/settings" class="admin-nav-link nav-settings">Settings</a>
        </div>
        <button class="admin-logout" onclick="logout()">Salir</button>
    </aside>

    <!-- <aside class="admin-sidebar">
        <a href="/" class="logo" style="display:block; margin-bottom:2.5rem">Green<span>.</span></a>
        <nav class="admin-nav">
            <a href="/admin/dashboard" class="admin-nav-link"
                style="color:rgba(245,240,232,0.5);display:block">Dashboard</a>
            <a href="/admin/productos" class="admin-nav-link"
                style="color:rgba(245,240,232,0.5);display:block">Productos</a>
            <a href="/admin/ordenes" class="admin-nav-link active"
                style="color:rgba(245,240,232,0.9);display:block">Órdenes</a>
        </nav>
        <button class="admin-logout" onclick="logout()">Salir</button>
    </aside> -->

    <main class="admin-main">
        <div class="admin-header">
            <h1 class="admin-title">Órdenes</h1>
            <div class="admin-filtros-status">
                <button class="filtro-status active" data-status="" onclick="filtrarOrdenes('', this)">
                    Todas
                </button>
                <button class="filtro-status" data-status="pending" onclick="filtrarOrdenes('pending', this)">
                    Pendientes
                </button>
                <button class="filtro-status" data-status="verifying" onclick="filtrarOrdenes('verifying', this)">
                    A verificar
                </button>
                <button class="filtro-status" data-status="paid" onclick="filtrarOrdenes('paid', this)">
                    Pagadas
                </button>
                <button class="filtro-status" data-status="preparing" onclick="filtrarOrdenes('preparing', this)">
                    Preparando
                </button>
                <button class="filtro-status" data-status="shipped" onclick="filtrarOrdenes('shipped', this)">
                    Enviadas
                </button>
            </div>
        </div>
        <p class="admin-registros" id="ordenes-count"></p>

        <div class="admin-tabla-wrapper">
            <table class="admin-tabla" id="tabla-ordenes">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Cliente</th>
                        <th>Ciudad</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Envío</th>
                        <th>Pago</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tbody-ordenes">
                    <tr>
                        <td colspan="8" style="text-align:center;color:var(--text-muted)">
                            Cargando...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="/static/admin.js"></script>
    <script>
        verificarAdmin();
        document.addEventListener("DOMContentLoaded", updateSettingsLink);
        cargarOrdenes("");

        async function cargarOrdenes(status) {
            const url = status ? `/api/admin/ordenes?status=${status}` : "/api/admin/ordenes";
            const ordenes = await apiAdmin(url);
            if (!ordenes) return;

            const tbody = document.getElementById("tbody-ordenes");

            if (ordenes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8"
                    style="text-align:center;color:var(--text-muted)">
                    No hay órdenes.</td></tr>`;
                return;
            }

            const statusLabel = {
                pending:   "Pendiente",
                verifying: "A verificar",
                paid:      "Pagada",
                preparing: "Preparando",
                shipped:   "Enviada",
                delivered: "Entregada",
                cancelled: "Cancelada",
            };

            const nextStatus = {
                pending:   "verifying",
                verifying: "paid",
                paid:      "preparing",
                preparing: "shipped",
                shipped:   "delivered",
            };

            const nextLabel = {
                pending:   "A verificar",
                verifying: "Marcar pagada",
                paid:      "Preparando",
                preparing: "Marcar enviada",
                shipped:   "Marcar entregada",
            };

            document.getElementById("ordenes-count").textContent =
                `${ordenes.length} ${ordenes.length === 1 ? "orden" : "ordenes"}`;

            tbody.innerHTML = ordenes.map(o => {
                const fecha = new Date(o.created_at).toLocaleDateString("es-AR");
                const itemsText = o.items.map(i => `${i.product_name} ×${i.quantity}`).join(", ");
                const next = nextStatus[o.status];

                const pagoLabel = o.payment_method === "transfer" ? "Transferencia" : "Mercado Pago";
                const comprobanteLink = o.comprobante_url
                    ? `<a href="${o.comprobante_url}" target="_blank" style="font-size:0.78rem;color:var(--clay)">Ver comprobante</a>`
                    : "";

                const envioLabel = {
                    domicilio: "🚚 Domicilio",
                    sucursal:  "📦 Sucursal",
                    personal:  "🤝 Personal",
                }[o.shipping_method] || "—";

                const sucursalInfo = o.shipping_branch
                    ? `<br><span style="font-size:0.75rem;color:var(--text-muted)">${o.shipping_branch}</span>`
                    : "";

                const trackingEditable = ["paid","preparing","shipped","delivered"].includes(o.status);
                const facturaEditable  = ["shipped","delivered"].includes(o.status);

                const disabledStyle   = "background:#f5f5f5;color:#bbb;cursor:not-allowed;";
                const enabledStyle    = "background:#fff;color:inherit;cursor:text;";
                const trackingStyle   = `font-size:0.78rem;padding:0.3rem 0.5rem;border:1px solid #ddd;border-radius:2px;width:130px;margin-bottom:0.2rem;${trackingEditable ? enabledStyle : disabledStyle}`;
                const facturaStyle    = `font-size:0.78rem;padding:0.3rem 0.5rem;border:1px solid #ddd;border-radius:2px;width:130px;margin-bottom:0.2rem;${facturaEditable  ? enabledStyle : disabledStyle}`;
                const btnDisabled     = `background:transparent;border:1px solid #eee;color:#ccc;font-size:0.75rem;cursor:not-allowed;`;
                const btnEnabled      = `background:transparent;border:1px solid #ddd;color:var(--text-muted);font-size:0.75rem;`;

                return `
                    <tr>
                        <td>#${o.id}</td>
                        <td><strong>${o.nombre}</strong></td>
                        <td>${o.ciudad || "—"}</td>
                        <td style="font-size:0.82rem;color:var(--text-muted);max-width:180px">
                            ${itemsText}
                        </td>
                        <td>
                            $${o.total.toLocaleString("es-AR")}
                            ${o.shipping_cost > 0 ? `<br><span style="font-size:0.75rem;color:var(--text-muted)">envío: $${o.shipping_cost.toLocaleString("es-AR")}</span>` : ""}
                        </td>
                        <td style="font-size:0.82rem">
                            ${envioLabel}${sucursalInfo}
                        </td>
                        <td style="font-size:0.82rem">
                            ${pagoLabel}
                            ${comprobanteLink ? `<br>${comprobanteLink}` : ""}
                        </td>
                        <td>
                            <span class="admin-badge badge-${o.status}">
                                ${statusLabel[o.status] || o.status}
                            </span>
                        </td>
                        <td style="font-size:0.82rem;color:var(--text-muted)">${fecha}</td>
                        <td>
                            ${next ? `
                                <button class="admin-btn-sm" style="margin-bottom:0.4rem;display:block"
                                        onclick="avanzarEstado(${o.id}, '${next}')">
                                    ${nextLabel[o.status]}
                                </button>
                            ` : ""}
                            <input type="text" id="tracking-${o.id}" value="${o.tracking_number || ''}"
                                   placeholder="Nro. seguimiento CA"
                                   style="${trackingStyle}"
                                   ${trackingEditable ? "" : "disabled"}>
                            <button class="admin-btn-sm" style="${trackingEditable ? btnEnabled : btnDisabled}"
                                    ${trackingEditable ? `onclick="guardarTracking(${o.id})"` : "disabled"}>✓</button>
                            <br>
                            <input type="text" id="factura-${o.id}" value="${o.factura_numero || ''}"
                                   placeholder="Nro. factura AFIP"
                                   style="${facturaStyle}"
                                   ${facturaEditable ? "" : "disabled"}>
                            <button class="admin-btn-sm" style="${facturaEditable ? btnEnabled : btnDisabled}"
                                    ${facturaEditable ? `onclick="guardarFactura(${o.id})"` : "disabled"}>✓</button>
                        </td>
                    </tr>
                `;
            }).join("");
        }

        async function avanzarEstado(id, status) {
            if (status === "shipped") {
                const tracking = document.getElementById(`tracking-${id}`)?.value.trim();
                if (!tracking) {
                    alert("Ingresá el número de seguimiento antes de marcar como enviada.");
                    return;
                }
            }
            await apiAdmin(`/api/admin/ordenes/${id}/status`, "PUT", { status });
            const statusActual = document.querySelector(".filtro-status.active").dataset.status;
            cargarOrdenes(statusActual);
        }

        async function guardarTracking(id) {
            const val = document.getElementById(`tracking-${id}`).value.trim();
            await apiAdmin(`/api/admin/ordenes/${id}/tracking`, "PUT", { tracking_number: val });
            const statusActual = document.querySelector(".filtro-status.active").dataset.status;
            cargarOrdenes(statusActual);
        }

        async function guardarFactura(id) {
            const val = document.getElementById(`factura-${id}`).value.trim();
            await apiAdmin(`/api/admin/ordenes/${id}/factura`, "PUT", { factura_numero: val });
            const statusActual = document.querySelector(".filtro-status.active").dataset.status;
            cargarOrdenes(statusActual);
        }

        function filtrarOrdenes(status, el) {
            document.querySelectorAll(".filtro-status").forEach(b => b.classList.remove("active"));
            el.classList.add("active");
            cargarOrdenes(status);
        }
    </script>
</body>

</html>
